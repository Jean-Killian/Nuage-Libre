<!DOCTYPE html>
<!--
  Nuage Libre: single-page web interface.

  File organisation (everything is served by FastAPI's StaticFiles mount,
  see app/main.py: "/" returns this file, "/static/..." returns the rest):

    static/index.html          structure only (this file)
    static/css/themes.css      design tokens + the 3 themes (day / night / pro)
    static/css/app.css         layout, cloud bubbles, sky, animations
    static/css/markdown.css    typography of the model's Markdown answers
    static/js/theme.js         theme switcher (+ circular reveal animation)
    static/js/sky.js           living backgrounds: drifting clouds, starry sky
    static/js/app.js           chat logic: API calls, streaming, conversations
    static/vendor/             pinned third-party libraries (see its README)
    static/fonts/              Nunito, served locally (no Google Fonts request)

  No build step and no framework: the browser loads these files as they are.
-->
<html lang="en" data-theme="day">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Nuage Libre — Local AI Chat</title>
  <meta name="theme-color" content="#eef8ff" />

  <!-- Apply the saved theme BEFORE the page is painted. If this waited for
       js/theme.js (loaded at the end of <body>), a user who chose the night
       theme would first see a white flash ("FOUC", flash of unstyled
       content). This tiny script is deliberately inline and synchronous. -->
  <script>
    (function () {
      var theme = null;
      try { theme = localStorage.getItem('nuage-libre:theme'); } catch (e) { /* storage blocked */ }
      if (theme !== 'day' && theme !== 'night' && theme !== 'pro') {
        // First visit: follow the operating system's light/dark preference.
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day';
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>

  <!-- Order matters: tokens first, then components that use them. -->
  <link rel="preload" href="/static/fonts/nunito-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/static/css/themes.css" />
  <link rel="stylesheet" href="/static/css/app.css" />
  <link rel="stylesheet" href="/static/css/markdown.css" />
  <link rel="stylesheet" href="/static/vendor/highlight-github-dark.min.css" />
</head>
<body>

  <!-- ===================== SVG definitions (shared) ======================
       Gradients used by the mascot. Kept in a 0×0 SVG that is always
       rendered: gradients inside a display:none SVG are ignored by some
       browsers. The stop colours come from CSS so they follow the theme. -->
  <svg class="svg-defs" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="mascot-fill" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" class="mascot-stop-a" />
        <stop offset="1" class="mascot-stop-b" />
      </linearGradient>
    </defs>
  </svg>

  <!-- The mascot: a small kawaii cloud. Defined once in a <template> and
       cloned by js/app.js wherever it is needed (logo, welcome screen), so
       the drawing exists in a single place. Shapes: three circles + one
       rounded rectangle merged into one cloud silhouette, then a face. -->
  <template id="mascot-template">
    <svg class="mascot" viewBox="0 0 120 92" aria-hidden="true" focusable="false">
      <g class="mascot-body">
        <circle cx="36" cy="52" r="22" />
        <circle cx="60" cy="38" r="28" />
        <circle cx="86" cy="52" r="20" />
        <rect x="16" y="46" width="90" height="34" rx="17" />
      </g>
      <ellipse class="mascot-blush" cx="38" cy="64" rx="7" ry="4" />
      <ellipse class="mascot-blush" cx="84" cy="64" rx="7" ry="4" />
      <g class="mascot-eyes">
        <ellipse class="mascot-eye" cx="48" cy="56" rx="4.2" ry="5.4" />
        <ellipse class="mascot-eye" cx="74" cy="56" rx="4.2" ry="5.4" />
        <circle class="mascot-sparkle" cx="49.6" cy="53.6" r="1.5" />
        <circle class="mascot-sparkle" cx="75.6" cy="53.6" r="1.5" />
      </g>
      <path class="mascot-smile" d="M55 63 Q61 69 67 63" />
    </svg>
  </template>

  <!-- Small icons cloned by js/app.js (no innerHTML needed). -->
  <template id="icon-trash">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3" />
    </svg>
  </template>

  <!-- ===================== Living sky (background) =======================
       Three stacked layers, one per theme. Only the layer of the active
       theme is visible; the others fade out and stop painting. Purely
       decorative, so hidden from screen readers. -->
  <div class="sky" aria-hidden="true">
    <div class="sky-layer sky-day">
      <div class="aurora aurora-1"></div>
      <div class="aurora aurora-2"></div>
      <div class="aurora aurora-3"></div>
      <div id="drift-clouds" class="drift-clouds"></div>
    </div>
    <div class="sky-layer sky-night">
      <div class="nebula nebula-1"></div>
      <div class="nebula nebula-2"></div>
      <canvas id="star-canvas" class="star-canvas"></canvas>
    </div>
    <div class="sky-layer sky-pro"></div>
  </div>

  <div class="app">
    <!-- ===================== Sidebar: saved conversations ================== -->
    <!-- Off-canvas on mobile (opened by the ☰ button), always visible on wide screens. -->
    <aside id="sidebar" class="sidebar" aria-label="Conversations">
      <div class="brand">
        <span class="brand-mascot js-mascot"></span>
        <span class="brand-text">
          <span class="brand-name">Nuage <span class="brand-accent">Libre</span></span>
          <span class="brand-tagline">Local sovereign AI</span>
        </span>
      </div>

      <button id="new-chat-btn" type="button" class="new-chat">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14" /></svg>
        New chat
      </button>

      <nav class="conversations" aria-label="Saved conversations">
        <ul id="conversation-list" class="conversation-list"></ul>
        <p id="empty-list" class="empty-list" hidden>No saved conversations yet.</p>
      </nav>
    </aside>
    <!-- Dimmed backdrop behind the sidebar on mobile; clicking it closes the sidebar. -->
    <div id="sidebar-overlay" class="overlay" hidden></div>

    <!-- ============================ Main column ============================ -->
    <div class="main">
      <header class="topbar">
        <button id="sidebar-toggle" type="button" class="icon-btn sidebar-toggle"
                aria-label="Show conversations" aria-controls="sidebar" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M4 7h16M4 12h11M4 17h16" /></svg>
        </button>

        <!-- Model menu + health status, grouped in one floating pill. -->
        <div class="pill model-pill">
          <!-- Status dot: grey = unknown, green = AI engine + DB up, red = a service is down -->
          <span id="status-dot" class="status-dot" role="img" aria-label="Checking server status"></span>
          <label for="model-select" class="sr-only">AI model</label>
          <span class="select-wrap">
            <select id="model-select" class="model-select">
              <option>Loading models…</option>
            </select>
          </span>
        </div>

        <!-- Theme switcher: a radio group (only one theme at a time). Arrow keys
             move between options, as for native radio buttons (js/theme.js). -->
        <div id="theme-switcher" class="pill theme-switcher" role="radiogroup" aria-label="Theme">
          <span class="theme-indicator" aria-hidden="true"></span>
          <button type="button" role="radio" class="theme-option" data-theme-value="day"
                  aria-checked="false" title="Ciel de Jour" aria-label="Day sky theme">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" aria-hidden="true" focusable="false">
              <circle cx="12" cy="12" r="4.2" />
              <path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4" />
            </svg>
          </button>
          <button type="button" role="radio" class="theme-option" data-theme-value="night"
                  aria-checked="false" title="Ciel de Nuit" aria-label="Night sky theme">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" />
              <path d="M17 3.5v3M15.5 5h3" />
            </svg>
          </button>
          <button type="button" role="radio" class="theme-option" data-theme-value="pro"
                  aria-checked="false" title="Mode Pro" aria-label="Professional theme">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <rect x="3.5" y="7" width="17" height="12.5" rx="3" />
              <path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7M3.5 12.5h17" />
            </svg>
          </button>
        </div>
      </header>

      <!-- aria-live: screen readers announce new messages as they arrive -->
      <main id="chat-history" class="chat" aria-live="polite">
        <div id="messages" class="messages"></div>
      </main>

      <footer class="composer-wrap">
        <form id="chat-form" class="composer">
          <label for="user-input" class="sr-only">Your message</label>
          <!-- Textarea: Enter sends, Shift+Enter inserts a new line -->
          <textarea id="user-input" class="composer-input" rows="1" placeholder="Ask anything…"
                    title="Enter to send, Shift+Enter for a new line" required></textarea>
          <button id="send-btn" type="submit" class="send-btn" aria-label="Send message">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <path d="M12 19V5M5.5 11.5 12 5l6.5 6.5" />
            </svg>
          </button>
        </form>
        <p class="composer-hint">Runs 100% on your own machine · Enter to send, Shift+Enter for a new line</p>
      </footer>
    </div>
  </div>

  <!-- Libraries first (app.js uses them), then our own scripts.
       `defer` downloads in parallel and runs the scripts in order once the
       HTML is parsed, so every element above already exists. -->
  <script defer src="/static/vendor/marked.umd.js"></script>
  <script defer src="/static/vendor/purify.min.js"></script>
  <script defer src="/static/vendor/highlight.min.js"></script>
  <script defer src="/static/js/sky.js"></script>
  <script defer src="/static/js/theme.js"></script>
  <script defer src="/static/js/app.js"></script>
</body>
</html>
