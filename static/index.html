<!DOCTYPE html>
<!-- color-scheme: dark makes native widgets (scrollbars, form controls) dark too -->
<html lang="en" class="dark" style="color-scheme: dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nuage Libre — Local AI Chat</title>
  <!-- TODO (sovereignty): Tailwind is loaded from a CDN for now. It will be
       compiled locally so the UI makes no request outside the machine. -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Markdown rendering, served locally from static/vendor/ (see its README):
       marked = Markdown -> HTML, DOMPurify = removes anything dangerous from
       that HTML, highlight.js = colours code blocks. -->
  <script src="/static/vendor/marked.umd.js"></script>
  <script src="/static/vendor/purify.min.js"></script>
  <script src="/static/vendor/highlight.min.js"></script>
  <link rel="stylesheet" href="/static/vendor/highlight-github-dark.min.css" />

  <style>
    /* ---- Typography of rendered Markdown answers ----------------------
       Written by hand (rather than a CSS framework plugin) to keep full
       control of spacing inside chat bubbles. All rules are scoped to
       .markdown so they never leak into the rest of the page. */
    .markdown { line-height: 1.65; overflow-wrap: anywhere; }
    .markdown > :first-child { margin-top: 0; }
    .markdown > :last-child { margin-bottom: 0; }
    .markdown p, .markdown ul, .markdown ol, .markdown pre,
    .markdown blockquote, .markdown table { margin: 0.75em 0; }
    .markdown h1, .markdown h2, .markdown h3, .markdown h4 {
      margin: 1.2em 0 0.5em; font-weight: 600; line-height: 1.3; color: #f1f5f9;
    }
    .markdown h1 { font-size: 1.35em; }
    .markdown h2 { font-size: 1.2em; }
    .markdown h3 { font-size: 1.08em; }
    .markdown ul { list-style: disc; padding-left: 1.4em; }
    .markdown ol { list-style: decimal; padding-left: 1.6em; }
    .markdown li { margin: 0.25em 0; }
    .markdown li > ul, .markdown li > ol { margin: 0.25em 0; }
    .markdown a { color: #34d399; text-decoration: underline; text-underline-offset: 2px; }
    .markdown strong { color: #f8fafc; font-weight: 600; }
    .markdown blockquote {
      border-left: 3px solid #475569; padding-left: 0.9em; color: #94a3b8;
    }
    .markdown hr { border: 0; border-top: 1px solid #334155; margin: 1.2em 0; }
    /* Inline code: `like this` */
    .markdown :not(pre) > code {
      background: #0f172a; border: 1px solid #334155; border-radius: 0.35em;
      padding: 0.1em 0.35em; font-size: 0.88em;
    }
    /* Code blocks: ```lang ... ``` */
    .markdown pre {
      position: relative; background: #0d1117; border: 1px solid #334155;
      border-radius: 0.6em; overflow-x: auto; font-size: 0.85em;
    }
    .markdown pre code { display: block; padding: 0.9em 1em; background: transparent; }
    .markdown .code-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.3em 0.6em 0.3em 1em; border-bottom: 1px solid #334155;
      font-size: 0.8em; color: #94a3b8; font-family: ui-monospace, monospace;
    }
    .markdown .copy-btn { padding: 0.15em 0.6em; border-radius: 0.4em; }
    .markdown .copy-btn:hover { background: #1e293b; color: #e2e8f0; }
    /* Tables scroll horizontally on small screens instead of overflowing. */
    .markdown table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; }
    .markdown th, .markdown td { border: 1px solid #334155; padding: 0.4em 0.75em; text-align: left; }
    .markdown th { background: #1e293b; font-weight: 600; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-dvh flex antialiased overflow-hidden">

  <!-- ===================== Sidebar: saved conversations ===================== -->
  <!-- Off-canvas on mobile (toggled by the ☰ button), always visible from md: -->
  <aside id="sidebar"
         class="fixed inset-y-0 left-0 z-30 w-72 -translate-x-full md:translate-x-0 md:static
                transition-transform duration-200 bg-slate-900 border-r border-slate-800 flex flex-col"
         aria-label="Conversations">
    <div class="p-3 border-b border-slate-800">
      <button id="new-chat-btn" type="button"
              class="w-full rounded-xl border border-slate-700 hover:bg-slate-800 px-4 py-2.5 text-sm font-medium
                     text-slate-200 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500">
        + New chat
      </button>
    </div>
    <nav class="flex-1 overflow-y-auto p-2">
      <ul id="conversation-list" class="space-y-1"></ul>
      <p id="empty-list" class="hidden px-3 py-6 text-xs text-slate-500 text-center">No saved conversations yet.</p>
    </nav>
  </aside>
  <!-- Dark overlay behind the sidebar on mobile; clicking it closes the sidebar -->
  <div id="sidebar-overlay" class="fixed inset-0 z-20 bg-black/50 hidden md:hidden"></div>

  <!-- ============================ Main column ============================ -->
  <div class="flex-1 flex flex-col min-w-0">
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur px-4 md:px-6 py-4 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3 min-w-0">
        <button id="sidebar-toggle" type="button" class="md:hidden text-slate-300 hover:text-white p-1 -ml-1"
                aria-label="Show conversations" aria-controls="sidebar" aria-expanded="false">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
        <!-- Status dot: grey = unknown, green = Ollama + DB up, red = a service is down -->
        <div id="status-dot" class="h-3 w-3 shrink-0 rounded-full bg-slate-500" role="img" aria-label="Checking server status"></div>
        <h1 class="hidden sm:block text-lg font-semibold tracking-tight text-white shrink-0">Nuage Libre</h1>
        <!-- Model menu: filled from GET /api/models. The choice applies to the
             next message, and is remembered in the browser (localStorage). -->
        <label for="model-select" class="sr-only">AI model</label>
        <select id="model-select"
                class="min-w-0 max-w-[60vw] sm:max-w-xs truncate text-xs font-mono pl-3 pr-8 py-1.5 rounded-lg
                       bg-slate-800 text-slate-200 border border-slate-700 hover:border-slate-500 cursor-pointer
                       focus:outline-none focus:ring-2 focus:ring-emerald-500">
          <option>Loading models…</option>
        </select>
      </div>
      <span class="hidden sm:inline text-xs text-slate-400 shrink-0">Local Sovereign AI</span>
    </header>

    <!-- aria-live: screen readers announce new messages as they arrive -->
    <main id="chat-history" class="flex-1 overflow-y-auto p-4 md:p-6" aria-live="polite">
      <div id="messages" class="space-y-4 max-w-4xl w-full mx-auto"></div>
    </main>

    <footer class="border-t border-slate-800 bg-slate-900/60 p-3 md:p-4">
      <form id="chat-form" class="max-w-4xl mx-auto flex gap-3 items-end">
        <label for="user-input" class="sr-only">Your message</label>
        <!-- Textarea: Enter sends, Shift+Enter inserts a new line -->
        <textarea id="user-input" rows="1" placeholder="Ask anything…"
                  title="Enter to send, Shift+Enter for a new line" required
                  class="flex-1 resize-none max-h-48 rounded-xl bg-slate-900 border border-slate-700 px-4 py-3 text-sm
                         text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500
                         focus:border-transparent"></textarea>
        <button id="send-btn" type="submit"
                class="rounded-xl bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 disabled:opacity-50
                       disabled:pointer-events-none px-6 py-3 text-sm font-medium text-white transition-colors shadow-sm">
          Send
        </button>
      </form>
    </footer>
  </div>

  <script>
    /*
     * Nuage Libre front-end (vanilla JavaScript, no framework).
     *
     * Security rules (XSS = Cross-Site Scripting prevention):
     *
     * 1. By default, text coming from the server, the user or the model is
     *    inserted with `textContent`: the browser displays it as plain text
     *    and never executes it, even if it contains HTML tags.
     * 2. ONE exception: the model's answers are Markdown and must be shown as
     *    formatted HTML. They go through renderMarkdown(), which converts
     *    them with marked and then passes the HTML through DOMPurify before
     *    it touches `innerHTML`. DOMPurify keeps harmless formatting (bold,
     *    lists, tables, code...) and strips everything that can run code:
     *    script tags, event handlers (onerror=...), javascript: links...
     *    `innerHTML` must never be used anywhere else.
     *
     * (Note: the literal closing tag of a script element must never appear
     * inside this block, not even in a comment: the HTML parser would end
     * the script there.)
     */

    // ---------------------------------------------------------------- state
    // Id of the conversation shown on screen; null = a new, unsaved chat.
    let currentConversationId = null;
    let isGenerating = false;

    // ------------------------------------------------------------- elements
    const $ = (id) => document.getElementById(id);
    const chatForm = $('chat-form');
    const userInput = $('user-input');
    const sendBtn = $('send-btn');
    const chatHistory = $('chat-history');
    const messagesEl = $('messages');
    const listEl = $('conversation-list');
    const sidebar = $('sidebar');
    const overlay = $('sidebar-overlay');

    // ------------------------------------------------------------ rendering
    const scrollToBottom = () => { chatHistory.scrollTop = chatHistory.scrollHeight; };

    function showWelcome() {
      messagesEl.replaceChildren();
      appendBubble('assistant').answer.textContent =
        'Hello! I am running locally on Nuage Libre. How can I help you today?';
    }

    /**
     * Create an empty message bubble and return handles to its parts.
     * role: 'user' | 'assistant' | 'error'
     */
    function appendBubble(role) {
      const wrapper = document.createElement('div');
      wrapper.className = role === 'user' ? 'flex justify-end' : 'flex justify-start';
      const bubble = document.createElement('div');
      const base = 'max-w-[85%] rounded-2xl px-4 py-3 text-sm break-words shadow-sm';
      const parts = { wrapper, bubble };

      if (role === 'user') {
        bubble.className = `${base} rounded-tr-sm bg-emerald-600 text-white whitespace-pre-wrap`;
        parts.answer = bubble;
      } else if (role === 'error') {
        bubble.className = `${base} rounded-tl-sm bg-red-950/80 border border-red-800 text-red-200 whitespace-pre-wrap`;
        bubble.setAttribute('role', 'alert');
        parts.answer = bubble;
      } else {
        bubble.className = `${base} rounded-tl-sm bg-slate-800/90 border border-slate-700/70 text-slate-200`;

        // Collapsible block (<details>) for the model's reasoning ("thinking").
        const details = document.createElement('details');
        details.className = 'hidden mb-3 rounded-xl bg-slate-900/90 border border-slate-700/80 overflow-hidden';
        const summary = document.createElement('summary');
        summary.className = 'px-3.5 py-2 text-xs font-medium text-slate-300 bg-slate-800/80 hover:bg-slate-700/60 cursor-pointer select-none';
        summary.textContent = 'Thought process';
        const thought = document.createElement('div');
        thought.className = 'px-3.5 py-2.5 text-xs text-slate-400 font-mono whitespace-pre-wrap border-t border-slate-800 leading-relaxed';
        details.append(summary, thought);

        // Answer area, styled by the .markdown rules in <head>.
        const answer = document.createElement('div');
        answer.className = 'markdown';
        // Generation statistics (tokens, speed), shown under the answer.
        const stats = document.createElement('div');
        stats.className = 'hidden mt-2 text-[11px] text-slate-500 font-mono';

        bubble.append(details, answer, stats);
        Object.assign(parts, { details, summary, thought, answer, stats });
      }

      wrapper.appendChild(bubble);
      messagesEl.appendChild(wrapper);
      scrollToBottom();
      return parts;
    }

    /** "hf.co/user/Model-GGUF:Q4_K_M" -> "Model-GGUF:Q4_K_M" (short display name). */
    const shortModelName = (name) => (name || '').split('/').pop();

    /** Footer of an answer: model name + generation statistics. */
    function showStats(parts, model, tokenCount, generationMs) {
      const items = [];
      if (model) items.push(shortModelName(model));
      if (tokenCount && generationMs) {
        const tps = (tokenCount / (generationMs / 1000)).toFixed(1);
        items.push(`${tokenCount} tokens`, `${(generationMs / 1000).toFixed(1)} s`, `${tps} tok/s`);
      }
      if (!items.length) return;
      parts.stats.textContent = items.join(' · ');
      parts.stats.title = model || '';
      parts.stats.classList.remove('hidden');
    }

    function showThought(parts, text) {
      if (!text) return;
      parts.details.classList.remove('hidden');
      parts.thought.textContent = text;
    }

    // ------------------------------------------------------------- markdown
    // GFM = GitHub Flavored Markdown (tables, ~~strike~~, task lists...).
    marked.setOptions({ gfm: true, breaks: false });

    // DOMPurify hook, run on every element it keeps: links open in a new tab,
    // and rel="noopener noreferrer" prevents the opened page from controlling
    // this one through window.opener (reverse tabnabbing).
    DOMPurify.addHook('afterSanitizeAttributes', (node) => {
      if (node.tagName === 'A') {
        node.setAttribute('target', '_blank');
        node.setAttribute('rel', 'noopener noreferrer');
      }
    });

    /**
     * Convert a Markdown string to safe HTML and display it in `el`.
     * marked produces HTML (which may contain anything the model wrote,
     * including raw HTML); DOMPurify then removes every dangerous element
     * and attribute. Only the sanitised result reaches innerHTML.
     */
    function renderMarkdown(el, markdownText) {
      const unsafeHtml = marked.parse(markdownText);
      el.innerHTML = DOMPurify.sanitize(unsafeHtml);
    }

    /**
     * Copy text to the clipboard. navigator.clipboard only exists on "secure"
     * pages (https:// or localhost). Over Tailscale the UI is served from
     * http://100.x.x.x, which is not considered secure, so we fall back to the
     * older execCommand('copy') technique with a temporary hidden textarea.
     */
    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(text);
          return;
        } catch {
          // Permission refused by the browser: try the fallback below.
        }
      }
      const tmp = document.createElement('textarea');
      tmp.value = text;
      tmp.style.position = 'fixed';
      tmp.style.opacity = '0';
      document.body.appendChild(tmp);
      tmp.select();
      const ok = document.execCommand('copy');
      tmp.remove();
      if (!ok) throw new Error('Copy refused by the browser');
    }

    /**
     * Final touches on code blocks once an answer is complete: syntax
     * highlighting, plus a header showing the language and a "Copy" button.
     * Done only at the end (not on every streamed token) because
     * highlighting is relatively expensive.
     */
    function enhanceCodeBlocks(el) {
      el.querySelectorAll('pre > code').forEach((code) => {
        const pre = code.parentElement;
        if (pre.dataset.enhanced) return;
        pre.dataset.enhanced = 'true';

        hljs.highlightElement(code);
        // marked marks fenced blocks as class="language-python" etc.
        const langClass = [...code.classList].find((c) => c.startsWith('language-'));
        const language = langClass ? langClass.slice('language-'.length) : 'code';

        const header = document.createElement('div');
        header.className = 'code-header';
        const label = document.createElement('span');
        label.textContent = language;
        const copy = document.createElement('button');
        copy.type = 'button';
        copy.className = 'copy-btn';
        copy.textContent = 'Copy';
        copy.setAttribute('aria-label', `Copy ${language} code`);
        copy.addEventListener('click', async () => {
          try {
            await copyText(code.textContent);
            copy.textContent = 'Copied!';
          } catch {
            copy.textContent = 'Failed';
          }
          setTimeout(() => { copy.textContent = 'Copy'; }, 1500);
        });
        header.append(label, copy);
        pre.prepend(header);
      });
    }

    // ---------------------------------------------------------- model menu
    const modelSelect = $('model-select');
    const MODEL_STORAGE_KEY = 'nuage-libre:model';

    // localStorage can throw (private browsing, blocked storage): the menu
    // must keep working, the choice is just not remembered in that case.
    function savedModel() {
      try { return localStorage.getItem(MODEL_STORAGE_KEY); } catch { return null; }
    }
    function saveModel(name) {
      try { localStorage.setItem(MODEL_STORAGE_KEY, name); } catch { /* ignore */ }
    }

    /** Human-readable size: 2500000000 -> "2.5 GB". */
    const formatSize = (bytes) => `${(bytes / 1e9).toFixed(1)} GB`;

    async function loadModels() {
      let models = [];
      try {
        const response = await fetch('/api/models');
        if (response.ok) models = await response.json();
      } catch { /* handled below */ }

      modelSelect.replaceChildren();
      if (!models.length) {
        const option = new Option('No model available', '');
        option.disabled = true;
        modelSelect.append(option);
        return;
      }
      for (const m of models) {
        // e.g. "qwen3:4b — 4.0B · 2.5 GB · 🧠"   (🧠 = shows its reasoning)
        const details = [m.parameter_size, formatSize(m.size_bytes)].filter(Boolean);
        if (m.thinking) details.push('🧠');
        if (m.is_default) details.push('default');
        const option = new Option(`${shortModelName(m.name)} — ${details.join(' · ')}`, m.name);
        option.title = m.name;
        modelSelect.append(option);
      }
      // Restore the last choice if that model is still installed, else the default.
      const remembered = savedModel();
      const fallback = models.find((m) => m.is_default) || models[0];
      modelSelect.value = models.some((m) => m.name === remembered) ? remembered : fallback.name;
    }

    /** Select `name` in the menu if it is installed (used when opening a conversation). */
    function selectModel(name) {
      if ([...modelSelect.options].some((o) => o.value === name)) {
        modelSelect.value = name;
        saveModel(name);
      }
    }

    modelSelect.addEventListener('change', () => saveModel(modelSelect.value));

    // -------------------------------------------------------------- sidebar
    function openSidebar(open) {
      sidebar.classList.toggle('-translate-x-full', !open);
      overlay.classList.toggle('hidden', !open);
      $('sidebar-toggle').setAttribute('aria-expanded', String(open));
    }
    $('sidebar-toggle').addEventListener('click', () => openSidebar(true));
    overlay.addEventListener('click', () => openSidebar(false));

    async function refreshConversationList() {
      const response = await fetch('/api/conversations');
      if (!response.ok) return;
      const conversations = await response.json();
      listEl.replaceChildren();
      $('empty-list').classList.toggle('hidden', conversations.length > 0);

      for (const conv of conversations) {
        const li = document.createElement('li');
        const active = conv.id === currentConversationId;
        li.className = `group flex items-center rounded-lg ${active ? 'bg-slate-800' : 'hover:bg-slate-800/60'}`;

        const open = document.createElement('button');
        open.type = 'button';
        open.className = 'flex-1 min-w-0 text-left px-3 py-2 text-sm text-slate-300 truncate';
        open.textContent = conv.title;
        open.title = conv.title;
        if (active) open.setAttribute('aria-current', 'true');
        open.addEventListener('click', () => loadConversation(conv.id));

        const del = document.createElement('button');
        del.type = 'button';
        del.className = 'px-2 py-2 text-slate-500 hover:text-red-400 md:opacity-0 group-hover:opacity-100 focus:opacity-100';
        del.textContent = '✕';
        del.setAttribute('aria-label', `Delete conversation "${conv.title}"`);
        del.addEventListener('click', () => deleteConversation(conv.id, conv.title));

        li.append(open, del);
        listEl.appendChild(li);
      }
    }

    async function loadConversation(id) {
      if (isGenerating) return;
      const response = await fetch(`/api/conversations/${id}`);
      if (!response.ok) {
        appendBubble('error').answer.textContent = 'Could not load this conversation.';
        return;
      }
      const conv = await response.json();
      currentConversationId = conv.id;
      messagesEl.replaceChildren();
      for (const msg of conv.messages) {
        const parts = appendBubble(msg.role);
        if (msg.role === 'assistant') {
          renderMarkdown(parts.answer, msg.content);
          enhanceCodeBlocks(parts.answer);
          showThought(parts, msg.thinking);
          showStats(parts, msg.model, msg.token_count, msg.generation_ms);
        } else {
          parts.answer.textContent = msg.content; // user text: never interpreted
        }
      }
      // Continue with the model of the latest answer.
      selectModel(conv.model);
      openSidebar(false);
      refreshConversationList();
      userInput.focus();
    }

    async function deleteConversation(id, title) {
      if (!confirm(`Delete "${title}"? This cannot be undone.`)) return;
      const response = await fetch(`/api/conversations/${id}`, { method: 'DELETE' });
      if (response.ok && id === currentConversationId) newChat();
      refreshConversationList();
    }

    function newChat() {
      if (isGenerating) return;
      currentConversationId = null;
      showWelcome();
      openSidebar(false);
      refreshConversationList();
      userInput.focus();
    }
    $('new-chat-btn').addEventListener('click', newChat);

    // ----------------------------------------------------------------- chat
    /**
     * Read an NDJSON stream (one JSON object per line) and call onEvent for
     * each object. Network chunks do not respect line boundaries, so we
     * buffer the incomplete last line until the next chunk arrives.
     */
    async function readEvents(response, onEvent) {
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();
        for (const line of lines) if (line.trim()) onEvent(JSON.parse(line));
      }
      if (buffer.trim()) onEvent(JSON.parse(buffer));
    }

    function setBusy(busy) {
      isGenerating = busy;
      userInput.disabled = busy;
      sendBtn.disabled = busy;
    }

    async function sendMessage(message) {
      appendBubble('user').answer.textContent = message;
      setBusy(true);

      const ai = appendBubble('assistant');
      ai.answer.textContent = 'Thinking…';
      ai.bubble.classList.add('animate-pulse');
      let thought = '', answer = '', errorText = null, started = false, wasNew = false;

      // Re-rendering the whole Markdown on every token would be wasteful
      // (dozens of tokens per second). Instead we schedule at most one render
      // per screen frame (~60/s max) with requestAnimationFrame.
      let renderScheduled = false;
      let streamFinished = false;
      const scheduleRender = () => {
        if (renderScheduled) return;
        renderScheduled = true;
        requestAnimationFrame(() => {
          renderScheduled = false;
          // A frame scheduled just before the end must not overwrite the
          // final render (it would erase highlighting and copy buttons).
          if (streamFinished) return;
          renderMarkdown(ai.answer, answer);
          scrollToBottom();
        });
      };

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            conversation_id: currentConversationId,
            message,
            // Empty value (no model available) -> let the server decide.
            model: modelSelect.value || null,
          })
        });

        if (!response.ok) {
          // FastAPI errors look like {"detail": "..."} (or a list for 422).
          const body = await response.json().catch(() => ({}));
          errorText = typeof body.detail === 'string' ? body.detail : `Server error (${response.status})`;
        } else {
          await readEvents(response, (evt) => {
            if (!started && (evt.type === 'thinking' || evt.type === 'content')) {
              started = true;
              ai.bubble.classList.remove('animate-pulse');
              ai.answer.textContent = '';
            }
            switch (evt.type) {
              case 'conversation':
                currentConversationId = evt.id;
                wasNew = evt.is_new;
                break;
              case 'thinking':
                thought += evt.text;
                showThought(ai, thought);
                if (!answer) { ai.details.open = true; ai.summary.textContent = 'Thought process (thinking…)'; }
                break;
              case 'content':
                if (!answer) { ai.details.open = false; ai.summary.textContent = 'Thought process'; }
                answer += evt.text;
                scheduleRender();
                break;
              case 'error':
                errorText = evt.text;
                break;
              case 'done':
                showStats(ai, evt.model, evt.token_count, evt.generation_ms);
                break;
            }
            scrollToBottom();
          });
        }
      } catch (err) {
        errorText = `Network error: ${err.message}`;
      }

      ai.bubble.classList.remove('animate-pulse');
      streamFinished = true;
      if (answer) {
        // Final, complete render (a scheduled frame may not have run yet),
        // then syntax highlighting and copy buttons.
        renderMarkdown(ai.answer, answer);
        enhanceCodeBlocks(ai.answer);
      }
      if (errorText) {
        if (!answer) ai.wrapper.remove();
        appendBubble('error').answer.textContent = errorText;
        // The server saves nothing when generation fails: a brand-new
        // conversation therefore does not exist in the database.
        if (wasNew) currentConversationId = null;
      } else if (!answer) {
        ai.answer.textContent = '(Empty response)';
      }

      setBusy(false);
      userInput.focus();
      refreshConversationList();
    }

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const message = userInput.value.trim();
      if (!message || isGenerating) return;
      userInput.value = '';
      autoResize();
      sendMessage(message);
    });

    // Enter = send, Shift+Enter = new line (isComposing: ignore while an IME
    // is composing characters, e.g. accents on some keyboards).
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        chatForm.requestSubmit();
      }
    });
    // Grow the textarea with its content, up to max-h-48.
    const MAX_INPUT_HEIGHT = 192; // px, same as the max-h-48 class
    function autoResize() {
      userInput.style.height = 'auto';
      userInput.style.height = `${Math.min(userInput.scrollHeight, MAX_INPUT_HEIGHT)}px`;
      // Only show a scrollbar once the text no longer fits.
      userInput.style.overflowY = userInput.scrollHeight > MAX_INPUT_HEIGHT ? 'auto' : 'hidden';
    }
    userInput.addEventListener('input', autoResize);

    // --------------------------------------------------------------- health
    async function checkHealth() {
      const dot = $('status-dot');
      try {
        const h = await (await fetch('/api/health')).json();
        const ok = h.ollama === 'up' && h.database === 'up';
        dot.className = `h-3 w-3 shrink-0 rounded-full ${ok ? 'bg-emerald-400 shadow-[0_0_8px_#34d399]' : 'bg-red-500 shadow-[0_0_8px_#ef4444]'}`;
        dot.setAttribute('aria-label', `AI engine ${h.ollama}, database ${h.database}`);
      } catch {
        dot.className = 'h-3 w-3 shrink-0 rounded-full bg-red-500';
        dot.setAttribute('aria-label', 'Server unreachable');
      }
    }

    // ----------------------------------------------------------------- init
    showWelcome();
    autoResize();
    loadModels();
    refreshConversationList();
    checkHealth();
    setInterval(checkHealth, 30000);
  </script>
</body>
</html>
