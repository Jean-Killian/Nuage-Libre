<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nuage Libre — Local AI Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col antialiased">
  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="h-3 w-3 rounded-full bg-emerald-400 shadow-[0_0_8px_#34d399]"></div>
      <h1 class="text-lg font-semibold tracking-tight text-white">Nuage Libre</h1>
      <span class="text-xs font-mono px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-300 border border-slate-700">
        qwen2.5-coder:32b
      </span>
    </div>
    <span class="text-xs text-slate-400">Local Sovereign AI</span>
  </header>

  <!-- Chat History Area -->
  <main id="chat-history" class="flex-1 overflow-y-auto p-6 space-y-4 max-w-4xl w-full mx-auto">
    <div class="flex justify-start">
      <div class="max-w-[80%] rounded-2xl rounded-tl-sm bg-slate-800/90 border border-slate-700/70 px-4 py-3 text-sm text-slate-200 shadow-sm">
        Hello! I am running locally on <strong>Nuage Libre</strong> (<code class="text-emerald-400">qwen2.5-coder:32b</code>). How can I help you today?
      </div>
    </div>
  </main>

  <!-- Input Area -->
  <footer class="border-t border-slate-800 bg-slate-900/60 p-4">
    <form id="chat-form" class="max-w-4xl mx-auto flex gap-3">
      <input
        id="user-input"
        type="text"
        placeholder="Ask anything..."
        autocomplete="off"
        required
        class="flex-1 rounded-xl bg-slate-900 border border-slate-700 px-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent"
      />
      <button
        id="send-btn"
        type="submit"
        class="rounded-xl bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 disabled:opacity-50 disabled:pointer-events-none px-6 py-3 text-sm font-medium text-white transition-colors shadow-sm"
      >
        Send
      </button>
    </form>
  </footer>

  <script>
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const chatHistory = document.getElementById('chat-history');

    function appendMessage(role, text) {
      const wrapper = document.createElement('div');
      wrapper.className = role === 'user' ? 'flex justify-end' : 'flex justify-start';

      const bubble = document.createElement('div');
      if (role === 'user') {
        bubble.className = 'max-w-[80%] rounded-2xl rounded-tr-sm bg-emerald-600 px-4 py-3 text-sm text-white whitespace-pre-wrap break-words shadow-sm';
      } else if (role === 'error') {
        bubble.className = 'max-w-[80%] rounded-2xl rounded-tl-sm bg-red-950/80 border border-red-800 px-4 py-3 text-sm text-red-200 whitespace-pre-wrap break-words shadow-sm';
      } else {
        bubble.className = 'max-w-[80%] rounded-2xl rounded-tl-sm bg-slate-800/90 border border-slate-700/70 px-4 py-3 text-sm text-slate-200 whitespace-pre-wrap break-words shadow-sm';
      }

      bubble.textContent = text;
      wrapper.appendChild(bubble);
      chatHistory.appendChild(wrapper);
      chatHistory.scrollTop = chatHistory.scrollHeight;
      return bubble;
    }

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = userInput.value.trim();
      if (!message) return;

      appendMessage('user', message);
      userInput.value = '';
      userInput.disabled = true;
      sendBtn.disabled = true;

      const loadingBubble = appendMessage('ai', 'Thinking...');
      loadingBubble.classList.add('animate-pulse', 'text-slate-400');

      try {
        const response = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message })
        });

        const data = await response.json();
        loadingBubble.parentElement.remove();

        if (!response.ok) {
          appendMessage('error', data.detail || 'Error communicating with the server.');
        } else {
          appendMessage('ai', data.response || '(Empty response)');
        }
      } catch (err) {
        loadingBubble.parentElement.remove();
        appendMessage('error', 'Network error: ' + err.message);
      } finally {
        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();
      }
    });
  </script>
</body>
</html>
