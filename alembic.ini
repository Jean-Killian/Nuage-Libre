# Alembic configuration (database schema migrations).
#
#   venv/bin/alembic upgrade head      apply every pending migration
#   venv/bin/alembic downgrade -1      undo the last migration
#   venv/bin/alembic history           list migrations
#   venv/bin/alembic revision --autogenerate -m "add users table"
#                                      generate a migration from models.py changes
#
# The database URL is NOT stored here: migrations/env.py reads
# NUAGE_MIGRATION_DATABASE_URL from .env (owner role, allowed to ALTER tables).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# Migration file names: 2026_11_09_1030-<rev>_<message>.py (chronological sort)
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
